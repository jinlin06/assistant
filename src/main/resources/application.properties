spring.application.name=assistant

# ===== 智谱 GLM（可通过替换 Starter 依赖插拔为通义 / DeepSeek 等）=====
spring.ai.zhipuai.api-key=***REDACTED-LEAKED-KEY***
spring.ai.zhipuai.chat.options.model=glm-4.7-flash
# RAG 向量化所用 Embedding 模型
spring.ai.zhipuai.embedding.options.model=embedding-3

# ===== PostgreSQL：对话记忆 + 学情数据 + 学习任务 =====
# 连接参数支持环境变量覆盖，默认连接本机 5432 的 assistant 库
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:assistant}
spring.datasource.username=${PG_USERNAME:postgres}
spring.datasource.password=${PG_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# 首次启动自动建表；assistant 库若不存在会由 AssistantApplication 启动前的初始化器自动创建
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===== 私有知识库（RAG）=====
# 向量库本地持久化文件（SimpleVectorStore；换 Redis/Milvus 时此配置失效）
assistant.rag.store-path=${user.home}/.assistant/vector-store.json
# 文档上传大小上限
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
